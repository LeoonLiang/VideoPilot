name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tests and packaging use only Node built-ins and Ubuntu's zip/unzip.
      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Validate version and extract CHANGELOG notes
        run: npm run release:prepare -- "$RELEASE_TAG"

      - name: Package extension
        run: npm run package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # A failed upload leaves a draft that a re-run can finish safely.
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$state" != 'true' ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "VideoPilot $RELEASE_TAG" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "VideoPilot $RELEASE_TAG" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/VideoPilot.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false
