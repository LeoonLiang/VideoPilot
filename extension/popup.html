<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoPilot · 视频随心控</title>
  <link rel="stylesheet" href="popup.css">
  <script src="shared.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="m10 8 13 8-13 8z" fill="currentColor"/><path d="M25 8v16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div>
    <div class="brand"><h1>VideoPilot<span>视频随心控</span></h1><p>你的节奏，你来掌控。</p></div>
    <label class="switch" title="启用 VideoPilot"><input type="checkbox" id="enabled" aria-label="启用 VideoPilot"><span></span></label>
  </header>
  <main>
    <div class="status-line"><span id="mode-label"><i></i>视频控制已启用</span><span class="local-label">全局设置</span></div>
    <form id="settings-form" novalidate>
      <fieldset id="settings-fields" disabled>
        <section class="speed-card" aria-labelledby="speed-title">
          <div class="section-heading"><h2 id="speed-title">日常播放速度</h2><span class="tag">PLAYBACK</span></div>
          <div class="speed-display"><output id="speed-display" for="speed">1<span>×</span></output><span class="speed-caption">按自己的节奏观看</span></div>
          <div class="presets" role="group" aria-label="常用播放倍速">
            <button type="button" data-speed="1">1×</button><button type="button" data-speed="1.25">1.25×</button><button type="button" data-speed="1.5">1.5×</button><button type="button" data-speed="2">2×</button>
          </div>
          <div class="custom-speed"><label for="speed">自定义倍速 <small>0.25–4×</small></label><div class="number-box"><input id="speed" type="number" min="0.25" max="4" step="0.05" inputmode="decimal" aria-describedby="form-error"><span>×</span></div></div>
        </section>
        <section class="controls-card" aria-labelledby="controls-title">
          <div class="section-heading"><h2 id="controls-title">快捷控制</h2><span class="tag">SHORTCUTS</span></div>
          <div class="control-row"><kbd>X</kbd><label for="boostSpeed"><strong>长按加速</strong><small>按住 200ms，松开恢复</small></label><div class="number-box"><input id="boostSpeed" type="number" min="0.25" max="8" step="0.25" inputmode="decimal" aria-describedby="form-error"><span>×</span></div></div>
          <div class="row-divider"></div>
          <div class="control-row"><kbd>Z</kbd><label for="backwardSeconds"><strong>后退</strong><small>回看刚才的片段</small></label><div class="number-box"><input id="backwardSeconds" type="number" min="1" max="120" step="1" inputmode="numeric" aria-describedby="form-error"><span>秒</span></div></div>
          <div class="control-row"><kbd>X</kbd><label for="forwardSeconds"><strong>短按前进</strong><small>轻按松开，跳过一小段</small></label><div class="number-box"><input id="forwardSeconds" type="number" min="1" max="120" step="1" inputmode="numeric" aria-describedby="form-error"><span>秒</span></div></div>
          <div class="row-divider"></div>
          <div class="speed-shortcuts" role="group" aria-label="当前视频倍速快捷键"><span><kbd>S</kbd> −0.1×</span><span><kbd>D</kbd> +0.1×</span><span><kbd>R</kbd> 重置 1×</span></div>
        </section>
        <label class="hint-setting"><span>显示视频操作提示</span><input type="checkbox" id="showOverlay"><span class="mini-check" aria-hidden="true"></span></label>
      </fieldset>
      <p id="form-error" role="alert" hidden></p>
    </form>
    <aside><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 9v5m0-8v.5"/></svg><p>S / D 按住连续调速，松开即停；仅调当前视频。</p></aside>
  </main>
  <footer><span id="save-status" role="status">正在读取设置…</span><button type="button" id="reset" disabled>恢复默认</button></footer>
</body>
</html>
